<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ela Tasks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h1>Ela Tasks</h1>

        <p class="subtitle">
            My first feature running on AWS VPS
        </p>

        <div class="input-area">

            <input
                id="taskInput"
                type="text"
                placeholder="Enter task"
            >

            <button id="addBtn" onclick="addTask()">
                Add Task
            </button>

        </div>

        <ul id="taskList"></ul>

        <p class="status" id="status">
            Loading tasks...
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
